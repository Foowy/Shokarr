version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # Compile-only ref the Shoko host supplies at runtime -- must match the host's
      # bundled version exactly (currently 10.2.1) or the plugin fails to load. Bump
      # by hand against the host's /usr/src/app/build/Shoko.Server.deps.json.
      - dependency-name: "Asp.Versioning.*"
      # Also compile-only; keep at the host's bundled version (currently 6.2.0).
      - dependency-name: "NLog"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
